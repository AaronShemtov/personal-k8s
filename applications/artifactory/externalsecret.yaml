# The keys Artifactory needs and the admin password, from OCI Vault by secret name:
#
#   artifactory-master-key      64 hex characters: encrypts what Artifactory keeps in
#                               its database. It must never change while that
#                               database lives
#   artifactory-join-key        32 hex characters: lets the JFrog services (router,
#                               access, frontend, jfbus...) join one another
#   artifactory-admin-password  the admin user's password
#
# The chart takes all of them from one Secret. bootstrap.creds is the file that
# sets the admin password at every start of Artifactory, so a new password in the
# Vault takes effect at the next restart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: artifactory-secrets
  namespace: artifactory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: artifactory-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        master-key: "{{ .masterKey }}"
        join-key: "{{ .joinKey }}"
        password: "{{ .password }}"
        bootstrap.creds: "admin@*={{ .password }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: artifactory-master-key
    - secretKey: joinKey
      remoteRef:
        key: artifactory-join-key
    - secretKey: password
      remoteRef:
        key: artifactory-admin-password
