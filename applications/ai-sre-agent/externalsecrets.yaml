---
# Gemini API key, reconciled from OCI Vault. Gemini is the current LLM
# provider; the application's provider-neutral name does not change this key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gemini-api-key
  namespace: ai-sre-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: gemini-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: gemini-api-key       # Vault secret name
---
# Telegram bot token for the SRE agent, and its own bot since the split.
#
# It used to share `telegram-bot-token` with the Flux notifier. That ended when the
# token was found in the pod logs and therefore readable through the public Grafana:
# rotating it meant rotating two unrelated consumers together. Flux kept the original
# bot, because that bot is a member of the group it posts to and moving it is not
# free; the agent only needs a private chat, so it got the new one.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-telegram-token
  namespace: ai-sre-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agent-telegram-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: sre-agent-telegram-bot-token
