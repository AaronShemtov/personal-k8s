apiVersion: v1
kind: Service
metadata:
  name: mcp-cloudflare
  namespace: agents
spec:
  selector:
    app: mcp-cloudflare
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
---
# Cloudflare MCP server — our own code, because no self-hostable one exists.
#
# Cloudflare's official MCP servers (cloudflare/mcp, cloudflare/mcp-server-cloudflare)
# are Workers applications: they need platform-only bindings such as the Dynamic
# Worker Loader, and neither repository ships a Dockerfile or an image. Their
# product-specific hosted servers do not cover DNS record CRUD, WAF rules or tunnel
# configuration at all — dns-analytics is read-only analytics. So this wraps the ~13
# REST calls we actually need.
#
# Unlike mcp-github, the credential lives HERE and never leaves: this server holds the
# Cloudflare token and exposes only the tools we wrote.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-cloudflare
  namespace: agents
  labels:
    app: mcp-cloudflare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-cloudflare
  template:
    metadata:
      labels:
        app: mcp-cloudflare
    spec:
      serviceAccountName: mcp-cloudflare
      imagePullSecrets:
        - name: ocir-pull-secret
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: name
                    operator: In
                    values: ["main-pool"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-cloudflare
          image: il-jerusalem-1.ocir.io/axiwhc5fgu9i/ai-agents-platform:0.0.15 # {"$imagepolicy": "flux-system:ai-agents-platform"}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mcp_cloudflare"]
          ports:
            - name: mcp
              containerPort: 8080
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agents-cloudflare-api-token
                  key: token
            # Set explicitly so the token does not need "Account Settings: Read"
            # just to auto-detect this. Not a secret — it is in the dashboard URL.
            - name: CLOUDFLARE_ACCOUNT_ID
              value: "b2a32119439a7fbc016f267e489efab5"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          # Readiness verifies the token against Cloudflare, so an expired or
          # wrongly-scoped token surfaces as NotReady instead of as tool failures.
          #
          # timeoutSeconds is set explicitly: the default is 1s, and this probe makes a
          # real HTTPS call to api.cloudflare.com while the client itself allows 30s.
          # At 1s a single slow round trip counts as a failure, and three in a row pull
          # the pod out of the Service for no good reason.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
