---
# Telegram bot token for the agent platform.
#
# Deliberately NOT the same Vault secret as `telegram-bot-token`, which the Flux
# notifier and the SRE agent already share: Telegram long polling allows exactly one
# getUpdates consumer per token, so a second poller on the same token would 409.
# The bot is @LeadEngineeringAgent_bot; the Vault secret is named for what it is
# rather than for the bot, matching ocir-auth-token / gemini-api-key in the same vault.
# Store the raw token string — not JSON: the OCI provider puts the secret body into the
# field verbatim, so a wrapper object would arrive in the pod braces and all.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-lead-telegram-bot-token
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agent-lead-telegram-bot-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-lead-telegram-bot-token   # Vault secret name
---
# Azure AI Foundry API key. The endpoint URL itself is not secret and lives in the
# ConfigMap next to the model name.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agents-azure-openai-api-key
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agents-azure-openai-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: agents-azure-openai-api-key
---
# GitHub fine-grained PAT.
#
# This is the real guardrail for GitHub access: scope it to exactly the repositories
# the agent may touch (personal-k8s + whatever it is building), with Contents,
# Pull requests, Issues and Metadata — and WITHOUT repository-creation rights.
#
# It is mounted into the AGENT pod, not into mcp-github. The official GitHub MCP
# server in `http` mode has no token setting at all: it reads
# `Authorization: Bearer <PAT>` from every incoming request and 401s without it.
# (`GITHUB_PERSONAL_ACCESS_TOKEN` only works in its `stdio` mode.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agents-github-personal-access-token
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agents-github-personal-access-token
    creationPolicy: Owner
  data:
    - secretKey: pat
      remoteRef:
        key: agents-github-personal-access-token
---
# Cloudflare API token, mounted ONLY into mcp-cloudflare.
#
# Needs: Zone:DNS:Edit, Zone:WAF:Edit, Account:Cloudflare Tunnel:Edit, and
# Account:Account Settings:Read (so the account id can be auto-detected — otherwise
# set CLOUDFLARE_ACCOUNT_ID explicitly in the ConfigMap).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agents-cloudflare-api-token
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agents-cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agents-cloudflare-api-token
