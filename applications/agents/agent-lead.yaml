apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-lead-config
  namespace: agents
data:
  # --- which agent this process is ------------------------------------------
  AGENT_PROFILE: "lead"
  AGENTS_DIR: "/app/agents"
  # --- LLM: Azure AI Foundry -------------------------------------------------
  # The /openai/v1/ path is mandatory. The deployment name goes in `model`.
  AZURE_OPENAI_BASE_URL: "https://ai-agent-support.services.ai.azure.com/openai/v1/"
  # These are deployment names in Foundry, not catalogue model ids. The three
  # gpt-5.6 deployments are the same base model with different system prompts;
  # /model lets the user choose per conversation.
  #
  # gpt-5.2-codex and gpt-5.3-codex exist in the resource but are intentionally
  # absent: they only expose /responses, which agentcore.llm.azure does not speak yet.
  # Ironically those are the two models specialised for code. Adding them means
  # teaching the LLM client the Responses API — a real change, not a config line.
  MODEL_DEFAULT: "gpt-5.6-sol"
  MODEL_ALLOWLIST: "gpt-5-mini,gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,gpt-5.4-nano"
  # --- Telegram -------------------------------------------------------------
  # Comma-separated numeric Telegram user IDs. Not a secret — it is an allow-list.
  # Fail-closed: if this is empty the bot refuses everyone, including you.
  TELEGRAM_ALLOWED_USERS: "139236889"
  # --- MCP servers -----------------------------------------------------------
  MCP_GITHUB_URL: "http://mcp-github.agents.svc.cluster.local:8082/"
  MCP_CLOUDFLARE_URL: "http://mcp-cloudflare.agents.svc.cluster.local:8080/mcp"
  MCP_CLUSTER_URL: "http://mcp-cluster.agents.svc.cluster.local:8080/mcp"
  # --- policy ---------------------------------------------------------------
  GITHUB_WRITE_MODE: "direct-push"
  CLOUDFLARE_WRITE_MODE: "approve"
  PROTECTED_REPOS: "personal-k8s"
  # --- limits ---------------------------------------------------------------
  MAX_STEPS: "30"
  MAX_TOKENS_PER_TURN: "120000"
  LOG_LEVEL: "INFO"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-lead-secrets
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agent-lead-secrets
    creationPolicy: Owner
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: azure-foundry-api-key
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: agent-lead-telegram-token
    - secretKey: GITHUB_PAT
      remoteRef:
        key: agent-lead-github-pat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-lead
  namespace: agents
  labels:
    app.kubernetes.io/name: agent-lead
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  # One bot token must have exactly one Telegram poller. Recreate avoids a brief
  # overlap during rollout that would make both pods receive 409 Conflict.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-lead
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-lead
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: agent-lead
      imagePullSecrets:
        - name: ocir-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: il-jerusalem-1.ocir.io/axiwhc5fgu9i/ai-agents-platform:0.0.15 # {"$imagepolicy": "flux-system:ai-agents-platform"}
          imagePullPolicy: IfNotPresent
          # One image, three roles. This is the agent; the MCP servers run the same
          # image with a different command.
          command: ["python", "-m", "agentcore"]
          envFrom:
            - configMapRef:
                name: agent-lead-config
            - secretRef:
                name: agent-lead-secrets
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-lead
  namespace: agents
  labels:
    app.kubernetes.io/name: agent-lead
spec:
  selector:
    app.kubernetes.io/name: agent-lead
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
