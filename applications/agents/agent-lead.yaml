apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-lead-config
  namespace: agents
data:
  # --- which agent this process is ------------------------------------------
  AGENT_PROFILE: "lead"
  AGENTS_DIR: "/app/agents"
  # --- LLM: Azure AI Foundry -------------------------------------------------
  # The /openai/v1/ path is mandatory. The deployment name goes in `model`.
  AZURE_OPENAI_BASE_URL: "https://ai-agent-support.services.ai.azure.com/openai/v1/"
  # Deployment names in Foundry, not catalogue model ids. Note /openai/v1/models lists
  # the whole Foundry catalogue rather than what is deployed here, so it cannot be used
  # to check this list — every entry below was verified by actually calling it.
  #
  # sol / terra / luna are three capability tiers of one family, not one model with
  # different prompts: Intelligence Index 59 / 55 / 51 over a 25x price range
  # ($5.00 / $2.00 / $0.20 per 1M input). The coding gap is much narrower than the
  # price gap — Coding Agent Index 80 / 77 / 75 — so luna is the value pick for a role
  # that fires on every message, and sol is worth it for one that runs rarely.
  #
  # gpt-5-mini was dropped: its knowledge cutoff is May 2024, and it showed — asked for
  # a Dockerfile with readOnlyRootFilesystem it missed the temp-path redirection that
  # requirement is all about, while both gpt-5.6-sol and gpt-5.3-codex handled it.
  #
  # gpt-5.2-codex does NOT exist on this resource (404, "The API deployment for this
  # resource does not exist") — do not add it back.
  # gpt-6-astra leads. Confirmed present on this resource: /models lists
  # gpt-6-astra, gpt-6-astra-2026-09-03 and a -private variant.
  MODEL_DEFAULT: "gpt-6-astra"
  MODEL_ALLOWLIST: "gpt-6-astra,gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,gpt-5.4-nano,gpt-5.3-codex,gpt-5.1-codex-max,qwen3.5:0.8b"
  # Deployments that must be called on /responses rather than /chat/completions.
  #
  # The codex family rejects /chat/completions outright: HTTP 400 "The requested
  # operation is unsupported", and returns a proper function_call on /responses.
  # Microsoft and OpenAI both document this as a property of the family across four
  # generations, so it is not a gap that will close.
  #
  # gpt-6-astra is here for a different reason, measured 2026-09-07 against this
  # resource. Plain text on /chat/completions works and returns 200. Add a single
  # tool and the same endpoint answers HTTP 400: "Function tools with
  # reasoning_effort are not supported for gpt-6-astra in /v1/chat/completions. To
  # use function tools, use /v1/responses or set reasoning_effort to 'none'." The
  # lead is handed ~60 tools, so tools are not optional here and 'none' would throw
  # away the reasoning this model is worth having for. On /responses the same call
  # returns status=completed with function_call get_weather {"city":"Paris"}.
  #
  # Leaving astra out of this list would therefore not fail loudly at startup — it
  # would fail on the first turn that needs a tool, which is every turn.
  #
  # The codex models are the ones built for code, and it shows: on the same
  # Dockerfile task gpt-5.3-codex answered in 4.0s against 31.8s for gpt-5.6-sol,
  # got the read-only root filesystem right, and volunteered a /healthz endpoint
  # nobody asked for.
  MODELS_RESPONSES_API: "gpt-6-astra,gpt-5.3-codex,gpt-5.1-codex-max"
  # Tools Azure runs on its own side. web_search_preview is what lets the agent
  # read a page on the open internet — nothing in our own tool set can, so before
  # this "проверь вот эту страницу" was a request it could only decline.
  #
  # It does not appear in the tool catalogue and the loop never dispatches it:
  # Azure performs the search and returns its own output items. Only reaches
  # /responses models, which is every model above.
  #
  # Verified against this resource: asked for the H1 of example.com it answered
  # "Example Domain"; asked what 1ms.my is, it read the page.
  HOSTED_TOOLS: "web_search_preview"
  # --- self-hosted inference ------------------------------------------------
  # A separate Oracle VM in a different tenancy, so there is no private path to it:
  # llm-host.1ms.my is a Cloudflare Tunnel whose connector runs on that box and reaches
  # Ollama on localhost. Ollama has no authentication of its own and its /api/ surface
  # can pull and delete models, so two things gate it — the tunnel routes only ^/v1/,
  # and a WAF rule blocks anything without the header below.
  OLLAMA_BASE_URL: "https://llm-host.1ms.my/v1"
  MODELS_OLLAMA: "qwen3.5:0.8b"
  # Not a secret: the name of the header. The value comes from the vault.
  OLLAMA_AUTH_HEADER: "X-Agent-Key"
  # Qwen3.5 thinks by default, and on four CPU cores with no GPU that is the difference
  # between one second and a minute — measured on the box: 2103 completion tokens and
  # 58s for a one-sentence answer with thinking on. reasoning_effort is the only lever
  # Ollama honours over /v1; `think: false` works only on its native /api/chat.
  OLLAMA_REASONING_EFFORT: "none"
  # --- Telegram -------------------------------------------------------------
  # Comma-separated numeric Telegram user IDs. Not a secret — it is an allow-list.
  # Fail-closed: if this is empty the bot refuses everyone, including you.
  TELEGRAM_ALLOWED_USERS: "139236889"
  # --- MCP servers -----------------------------------------------------------
  MCP_GITHUB_URL: "http://mcp-github.agents.svc.cluster.local:8082/"
  MCP_CLOUDFLARE_URL: "http://mcp-cloudflare.agents.svc.cluster.local:8080/mcp"
  MCP_CLUSTER_URL: "http://mcp-cluster.agents.svc.cluster.local:8080/mcp"
  # The coder agent, reachable as one more MCP server. Its tool arrives as coder__ask
  # and is checked by policy and written to the audit log like any other call. The
  # client gives this server a much longer read timeout than the rest, because a
  # delegated agent runs a whole tool loop of its own before it answers.
  MCP_CODER_URL: "http://agent-coder.agents.svc.cluster.local:8080/mcp"
  # --- policy ---------------------------------------------------------------
  GITHUB_WRITE_MODE: "direct-push"
  CLOUDFLARE_WRITE_MODE: "approve"
  PROTECTED_REPOS: "personal-k8s"
  # --- durable memory -------------------------------------------------------
  # Conversation history and facts about the user, in the Autonomous Database
  # that also holds the URL shortener — but under its own schema, AGENTS, with
  # no grants on anything else. Verified: `select from admin.urls` as this user
  # is ORA-00942. An agent holding the ADMIN password could delete the
  # shortener's data by accident, so it does not hold it.
  #
  # ORDS' REST-Enabled SQL endpoint, so this needs no Oracle client, no wallet
  # and no network ACL change — the same reason the shortener talks SODA over
  # HTTPS. Note the /ords/agents/ path: that is the schema's own mapping,
  # created by ORDS_ADMIN.ENABLE_SCHEMA, not the ADMIN one.
  #
  # Unset either this or ADB_PASSWORD and the agent still starts, logs a
  # warning, and forgets everything on restart — which is how it behaved before
  # this existed.
  ADB_SQL_URL: "https://GB6D5BC088AFCDA-URLSHORTENERJSON.adb.il-jerusalem-1.oraclecloudapps.com/ords/agents/_/sql"
  ADB_USERNAME: "AGENTS"
  # Messages replayed into a chat after a restart. Token-based trimming happens
  # afterwards, so this bounds the read, not what is sent to the model.
  MEMORY_HISTORY_MESSAGES: "40"
  # --- limits ---------------------------------------------------------------
  MAX_STEPS: "30"
  # How much transcript goes out on one step.
  MAX_TOKENS_PER_TURN: "150000"
  # Spend ceiling for a whole turn, counting only tokens outside the cached prefix.
  # A thirty-step turn costs roughly 33k of these; this is a backstop, not a limit
  # ordinary work should meet. Summing raw prompt tokens instead is what produced the
  # spurious "достиг лимита токенов" message on healthy multi-step tasks.
  MAX_BILLABLE_TOKENS_PER_TURN: "300000"
  LOG_LEVEL: "INFO"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-lead-secrets
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: agent-lead-secrets
    creationPolicy: Owner
  # remoteRef.key is the OCI Vault secret NAME. These are not guessable — the three
  # below were previously invented (azure-foundry-api-key, agent-lead-telegram-token,
  # agent-lead-github-pat), none existed, and the agent pod sat in
  # CreateContainerConfigError because the Secret was never created. Check against the
  # other ExternalSecrets in this directory before changing one.
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: agents-azure-openai-api-key
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: agent-lead-telegram-bot-token
    - secretKey: GITHUB_PAT
      remoteRef:
        key: agents-github-personal-access-token
    - secretKey: OLLAMA_AUTH_TOKEN
      remoteRef:
        key: agents-llm-host-shared-secret
    # The AGENTS schema in the Autonomous Database — see ADB_SQL_URL above.
    # Not the ADMIN password: this user can read and write its own two tables
    # and nothing else.
    - secretKey: ADB_PASSWORD
      remoteRef:
        key: agents-adb-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-lead
  namespace: agents
  labels:
    app: agent-lead
spec:
  replicas: 1
  # One bot token must have exactly one Telegram poller. Recreate avoids a brief
  # overlap during rollout that would make both pods receive 409 Conflict.
  strategy:
    type: Recreate
  # spec.selector is IMMUTABLE. Changing it on a live Deployment makes every apply
  # fail with "field is immutable", and since Flux applies ./applications as a single
  # Kustomization, that one failure freezes every other app in the tree. Switching
  # these to app.kubernetes.io/name did exactly that. Changing them now requires
  # deleting the Deployment first — a deliberate act, not a tidy-up.
  selector:
    matchLabels:
      app: agent-lead
  template:
    metadata:
      labels:
        app: agent-lead
    spec:
      # Kubernetes defaults to ndots:5, which means any name with fewer than five dots
      # is tried against all five search suffixes BEFORE being asked as written. Measured
      # on this cluster: 77% of every DNS query is a search-suffix attempt that returns
      # NXDOMAIN, and one lookup of api.telegram.org costs up to ten queries. Everything
      # here is addressed by its full name, so asking as written first is both correct
      # and cheaper. ndots only reorders the attempts, it cannot make a name unresolvable.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      serviceAccountName: agent-lead
      imagePullSecrets:
        - name: ocir-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: il-jerusalem-1.ocir.io/axiwhc5fgu9i/ai-agents-platform:0.0.40 # {"$imagepolicy": "flux-system:ai-agents-platform"}
          imagePullPolicy: IfNotPresent
          # One image, three roles. This is the agent; the MCP servers run the same
          # image with a different command.
          command: ["python", "-m", "agentcore"]
          envFrom:
            - configMapRef:
                name: agent-lead-config
            - secretRef:
                name: agent-lead-secrets
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-lead
  namespace: agents
  labels:
    app: agent-lead
spec:
  selector:
    app: agent-lead
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
