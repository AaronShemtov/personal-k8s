---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ocir-pull-secret
  namespace: myip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ocir-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "il-jerusalem-1.ocir.io": {
                "username": "axiwhc5fgu9i/shemtov.aaron@gmail.com",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" "axiwhc5fgu9i/shemtov.aaron@gmail.com" .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: password
      remoteRef:
        key: ocir-auth-token
