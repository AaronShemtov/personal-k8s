---
# Primary route for the About Me site.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aboutme
  namespace: aboutme
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "aboutme.1ms.my"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aboutme-frontend
          port: 80
---
# Preserve old bookmarks and search results permanently.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cv-redirect
  namespace: aboutme
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "cv.1ms.my"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: aboutme.1ms.my
            statusCode: 301
