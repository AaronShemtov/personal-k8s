---
apiVersion: v1
kind: Namespace
metadata:
  name: aboutme
  labels:
    app.kubernetes.io/name: aboutme
    # Restricted PodSecurityStandard: nginx-unprivileged runs as UID 101.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aboutme
  namespace: aboutme
# Pods inherit the private OCIR pull credentials provisioned below.
imagePullSecrets:
  - name: ocir-pull-secret
