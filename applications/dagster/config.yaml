---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  namespace: dagster
data:
  ADB_SQL_URL: "https://GB6D5BC088AFCDA-URLSHORTENERJSON.adb.il-jerusalem-1.oraclecloudapps.com/ords/dagster/_/sql"
  ADB_USERNAME: "DAGSTER"
  LLM_BASE_URL: "https://ai-agent-support.services.ai.azure.com/openai/v1/"
  LLM_MODEL: "gpt-5.4-nano"
  # The owner's private chat with the lead bot (TELEGRAM_ALLOWED_USERS in agent-lead).
  TELEGRAM_CHAT_ID: "139236889"
  READER_PROFILE: "airline pricing and the aviation industry; AI and LLM tooling; Kubernetes, cloud and data engineering; Israeli tech"
  # Empty until the UI has a hostname; alerts then show the run id without a link.
  DAGSTER_UI_URL: ""
---
# Dagster instance configuration, mounted as $DAGSTER_HOME/dagster.yaml. Storage is
# the default: SQLite under DAGSTER_HOME, an emptyDir shared by both containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-instance
  namespace: dagster
data:
  dagster.yaml: |
    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator
      config:
        # Runs execute inside the daemon container; one at a time keeps its memory flat.
        max_concurrent_runs: 1
    telemetry:
      enabled: false
