---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  namespace: dagster
data:
  ADB_SQL_URL: "https://GB6D5BC088AFCDA-URLSHORTENERJSON.adb.il-jerusalem-1.oraclecloudapps.com/ords/dagster/_/sql"
  ADB_USERNAME: "DAGSTER"
  LLM_BASE_URL: "https://ai-agent-support.services.ai.azure.com/openai/v1/"
  # GPT-6 models on Azure are served through the Responses API only. Prices are USD per
  # million tokens, Global Standard, read off the Azure Retail Prices API on 2026-10-21.
  LLM_MODEL: "gpt-6.1-sol"
  LLM_API: "responses"
  LLM_PRICE_IN: "2.0"
  LLM_PRICE_OUT: "10.0"
  # The digest goes to the public channel t.me/dagsternews; @dagster_news_bot is its admin.
  TELEGRAM_CHAT_ID: "@dagsternews"
  # Failure alerts go to the owner's private chat with the bot, never to the channel. The
  # bot can write there only once the owner has pressed Start in it.
  TELEGRAM_ALERT_CHAT_ID: "139236889"
  READER_PROFILE: "airline pricing and the aviation industry; AI and LLM tooling; Kubernetes, cloud and data engineering; Israeli tech"
  # Empty until the UI has a hostname; alerts then show the run id without a link.
  DAGSTER_UI_URL: ""
---
# Dagster instance configuration, mounted as $DAGSTER_HOME/dagster.yaml. Storage is
# the default: SQLite under DAGSTER_HOME, an emptyDir shared by both containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-instance
  namespace: dagster
data:
  dagster.yaml: |
    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator
      config:
        # Runs execute inside the daemon container; one at a time keeps its memory flat.
        max_concurrent_runs: 1
    telemetry:
      enabled: false
