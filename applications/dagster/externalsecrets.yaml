# Secrets of the Dagster deployment, from OCI Vault by secret name.
#
#   dagster-adb       the DAGSTER schema's password; its own Vault secret, created
#                     with the schema (news-digest/sql/admin-setup.sql)
#   dagster-llm       the Azure OpenAI key the agents already use
#   dagster-telegram  the lead bot's token: the digest arrives in the same chat as
#                     the bot, which only ever sends from here and never polls
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-adb
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: dagster-adb
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: dagster-adb-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-llm
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: dagster-llm
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: agents-azure-openai-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-telegram
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: dagster-telegram
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-lead-telegram-bot-token
