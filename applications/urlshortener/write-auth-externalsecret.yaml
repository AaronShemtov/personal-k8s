---
# Authorisation for the two write endpoints, POST /shorten and
# POST /createcustom.
#
# Why this exists
#
# Those endpoints accepted anything at all. Between 2026-08-20 and 2026-08-22 a
# script used them to create 6002 short links pointing at 1001 phishing pages
# impersonating a credit union, and 1ms.my served those redirects for the next
# sixteen days — 99.6% of the database was someone else's campaign. The links
# have been deleted and the endpoints now require proof.
#
# A rate limit is not the fix and was never going to be. Cloudflare's free plan
# clamps the counting window to 10 seconds, so the strictest rule expressible
# still allows 8,640 writes a day from one address. The rate-limit rule stays as
# a second line, not the first.
#
# Two keys, two callers
#
#   turnstile-secret — verifies the one-time tokens the Turnstile widget on the
#                      page hands to a browser. This is the path real visitors
#                      take. The matching SITE key lives in the page and is
#                      public by design; only this half is secret.
#
#   api-key          — for scripted callers, which cannot solve a challenge.
#                      The homepage advertises `curl -X POST 1ms.my/shorten`,
#                      so removing that path would break a documented feature
#                      rather than secure anything.
#
# Vault secret names (create in the OCI Console before this reconciles):
#   urlshortener-turnstile-secret   ← Turnstile widget's Secret Key
#   urlshortener-api-key            ← any long random string
#
# The backend refuses to start in writer mode unless at least one of these is
# present, so a missing secret shows up as a CrashLoopBackOff with an explicit
# message rather than as an open endpoint.
#
# As with adb-credentials: env-injected values are captured at pod start, so
# rotating either secret needs `kubectl -n urlshortener rollout restart
# deploy/urlshortener-writer`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: urlshortener-write-auth
  namespace: urlshortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: urlshortener-write-auth
    creationPolicy: Owner
  data:
    - secretKey: turnstile-secret
      remoteRef:
        # Name of the secret in OCI Vault — NOT an OCID.
        # The ESO Oracle provider uses GetSecretBundleByName.
        key: urlshortener-turnstile-secret
    - secretKey: api-key
      remoteRef:
        key: urlshortener-api-key
