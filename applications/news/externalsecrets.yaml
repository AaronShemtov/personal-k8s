# Secrets of the news pipeline, from OCI Vault by secret name.
#
#   news-adb       the NEWS schema's password; its own Vault secret, created with
#                  the schema (news-digest/sql/admin-setup.sql)
#   news-llm       the Azure OpenAI key the agents already use
#   news-telegram  the lead bot's token: the digest arrives in the same chat as the
#                  bot, which only ever sends from here and never polls
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: news-adb
  namespace: news
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: news-adb
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: news-adb-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: news-llm
  namespace: news
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: news-llm
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: agents-azure-openai-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: news-telegram
  namespace: news
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: news-telegram
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-lead-telegram-bot-token
