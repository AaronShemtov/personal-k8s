---
# Credentials for the basic auth in front of oracle.1ms.my (see securitypolicy.yaml).
#
# Envoy Gateway reads them from an Opaque Secret under the key `.htpasswd`, in
# htpasswd format with a {SHA} hash (the only algorithm it supports), e.g.
#   oracle:{SHA}<base64 of the SHA-1 of the password>
# The whole line lives in OCI Vault as `oracle-basic-auth-htpasswd`, so no
# credential is committed here, not even a hash. To change the password,
# replace that Vault secret's value; ESO picks it up within the refresh interval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oracle-basic-auth
  namespace: oracle
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: oracle-basic-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        .htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: oracle-basic-auth-htpasswd
