---
# Routes fetcherr.1ms.my to the oracle-frontend Service, port 8081: my page for the
# Fetcherr application is a second page of that site (public/fetcherr.html in the OCI
# repo), so it needs no pod of its own. On 8081 nginx answers with that page and the
# files it uses, and with 404 for everything else.
#
# Its own port, not just its own Host header, so that this hostname only ever shows the
# Fetcherr page: an image from before nginx's fetcherr server does not listen on 8081,
# and Envoy then answers 503 instead of the Oracle page. The Oracle route stays on
# port 80.
#
# The page has no password: it is shared by link only, and nginx asks search engines
# not to index it.
#
# The public hostname is added to the remote-managed Cloudflare Tunnel by hand, in the
# dashboard, like oracle.1ms.my's.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fetcherr
  namespace: oracle
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "fetcherr.1ms.my"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oracle-frontend
          port: 8081
