---
# Routes all traffic for oracle.1ms.my to the oracle-frontend Service.
#
# The Cloudflare Tunnel already forwards oracle.1ms.my to the same Envoy
# data plane as the other hostnames (the public hostname exists in the
# remote-managed tunnel config). Until this route existed, Envoy answered 404.
#
# The Gateway has `allowedRoutes.namespaces.from: All`, so a route in this
# namespace attaches without a ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oracle
  namespace: oracle
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "oracle.1ms.my"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oracle-frontend
          port: 80
