# Routes jll.1ms.my to the oracle-frontend Service, port 8082: my page for the JLL
# application is a third page of that site (public/jll.html in the OCI repo), so it
# needs no pod of its own. On 8082 nginx answers with that page and the files it uses,
# and with 404 for everything else.
#
# Its own port, as fetcherr.1ms.my has (see fetcherr-httproute.yaml): an image from
# before nginx's jll server does not listen on 8082, and Envoy then answers 503 instead
# of another page.
#
# The page has no password: it is shared by link only, and nginx asks search engines
# not to index it.
#
# The public hostname is added to the remote-managed Cloudflare Tunnel by hand, in the
# dashboard, like the others.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jll
  namespace: oracle
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "jll.1ms.my"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oracle-frontend
          port: 8082
