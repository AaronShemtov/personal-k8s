# oracle-frontend serves oracle.1ms.my, built from github.com/AaronShemtov/OCI
# (a private repository: it holds the page's material).
#
# No backend and no database: nginx-unprivileged serving the static files baked into
# the image. The site is behind basic auth, enforced by Envoy Gateway before a request
# gets here (securitypolicy.yaml), with the password from OCI Vault; the pod itself holds
# no secret. Each push to the repo triggers a GitHub Actions build; Flux Image
# Automation then bumps the tag below.
#
# Same shape as infra-frontend: a small footprint, and two replicas so a
# rolling update never leaves the site without a ready pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-frontend
  namespace: oracle
  labels:
    app: oracle-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oracle-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: oracle-frontend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: name
                    operator: In
                    values:
                      - apps-pool
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: oracle-frontend
      serviceAccountName: oracle # carries the OCIR imagePullSecret
      containers:
        - name: nginx
          # Flux Image Automation rewrites this tag on every new OCIR push
          # matching the semver policy `>=0.0.0`.
          image: il-jerusalem-1.ocir.io/axiwhc5fgu9i/oracle-frontend:0.0.47 # {"$imagepolicy": "flux-system:oracle-frontend"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          # nginx-unprivileged uses UID 101; readOnlyRootFilesystem requires
          # writable mounts for cache/PID/temp, provided as emptyDir below.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-frontend
  namespace: oracle
  labels:
    app: oracle-frontend
spec:
  selector:
    app: oracle-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
