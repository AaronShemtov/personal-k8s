---
apiVersion: v1
kind: Namespace
metadata:
  name: oracle
  labels:
    app.kubernetes.io/name: oracle
    # Restricted PodSecurityStandard, like the other static sites.
    # nginx-unprivileged runs as UID 101, so this is compatible.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oracle
  namespace: oracle
# Pods using this ServiceAccount inherit imagePullSecrets without each Pod
# spec restating it. The Secret itself is provisioned by the ExternalSecret
# in this same folder, sourced from OCI Vault via ESO.
imagePullSecrets:
  - name: ocir-pull-secret
