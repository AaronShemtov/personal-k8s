name: one-time-aboutme-manifests
on:
  push:
    branches: [rename-cv-to-aboutme]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: rename-cv-to-aboutme}
      - name: Migrate manifests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('applications/cv')
          dst=Path('applications/aboutme')
          dst.mkdir(exist_ok=True)
          mapping={
            'namespace.yaml':'namespace.yaml',
            'imagepull-externalsecret.yaml':'imagepull-externalsecret.yaml',
            'cv-frontend.yaml':'aboutme-frontend.yaml',
          }
          for old,new in mapping.items():
              text=(src/old).read_text()
              text=text.replace('cv.1ms.my','aboutme.1ms.my').replace('cv-frontend','aboutme-frontend').replace('namespace: cv','namespace: aboutme').replace('name: cv','name: aboutme').replace('applications/cv','applications/aboutme').replace('"cv" namespace','"aboutme" namespace').replace('static one-page CV','static About Me site').replace('CV edits','About Me edits').replace('OCIR Console -> cv-frontend','OCIR Console -> aboutme-frontend')
              if old == 'cv-frontend.yaml':
                  text=text.replace('aboutme-frontend:0.0.19', 'aboutme-frontend:0.0.0')
              (dst/new).write_text(text)
          (dst/'httproute.yaml').write_text('''---
# Primary route for the About Me site.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aboutme
  namespace: aboutme
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "aboutme.1ms.my"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aboutme-frontend
          port: 80
---
# Preserve old bookmarks and search results permanently.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cv-redirect
  namespace: aboutme
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "cv.1ms.my"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: aboutme.1ms.my
            statusCode: 301
''')
          for p in src.glob('*.yaml'):
              p.write_text('# Moved to applications/aboutme/. Kept as a tombstone because this API cannot delete files.\n')
          p=Path('infrastructure/image-automation/image-automation.yaml')
          text=p.read_text().replace('# cv.1ms.my — static CV site.','# aboutme.1ms.my — static About Me site.').replace('cv-frontend','aboutme-frontend').replace('covers urlshortener/, cv/, pwd/,','covers urlshortener/, aboutme/, pwd/,')
          p.write_text(text)
          PY
          rm .github/workflows/rename-cv-to-aboutme.yml
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: migrate CV site to About Me'
          git push origin HEAD:rename-cv-to-aboutme
