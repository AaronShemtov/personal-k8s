# The flux-system Kustomization points at the repo root (path: ./). Without
# this file Flux generates a kustomization from every YAML below the root, so
# flux-system applied applications/ and infrastructure/ itself as well: every
# object there had two owners and the dependsOn order was bypassed. The root
# now holds only Flux and the two child Kustomizations, which apply their own
# folders (infrastructure first, then applications).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure.yaml
  - applications.yaml
