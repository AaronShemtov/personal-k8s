---
# Only the bot token comes from Vault. Channel/chat_id is set directly
# in the Provider manifest, not in the Secret (Telegram notifier reads
# it from spec.channel per the controller's NewTelegram code).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: telegram-credentials
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: telegram-credentials
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        # Renamed from the bare `telegram-bot-token`, which said nothing about whose
        # bot it was and was shared with the SRE agent. The two were split when both
        # tokens had to be rotated: this bot stays with Flux because it is a member of
        # the group it posts to (-1003921436547), and moving that is not free.
        key: notifications-telegram-bot-token
