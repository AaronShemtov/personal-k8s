---
# kube-prometheus-stack — the de-facto bundle of Prometheus + Alertmanager +
# node-exporter (DaemonSet) + kube-state-metrics + the Prometheus Operator.
#
# Pinning chart version 66.3.0 (Prometheus 2.55.x, Alertmanager 0.27.x,
# kube-state-metrics 2.14.0 from subchart 5.27.0). Bump deliberately by editing
# this value, never implicitly via Helm range matching.
#
# Notes:
#   * Grafana is in this chart by default — we DISABLE it here and run a
#     standalone grafana HelmRelease instead, so dashboards / data sources
#     can be customised without rebuilding the whole stack.
#   * node-exporter requires hostPID/hostNetwork — that's why the namespace
#     PSS is `privileged`.
#   * Prometheus and Alertmanager are pinned to the observability node via
#     nodeSelector + toleration on taint `workload=observability`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: kube-prometheus-stack

    # Disable bundled Grafana — we use a separate HelmRelease for Grafana
    # so its config (dashboards, data sources, plugins) is decoupled.
    grafana:
      enabled: false

      # Even though bundled Grafana is disabled, we keep the chart's default
      # dashboard ConfigMaps. The chart generates them with label
      # grafana_dashboard=1, which the standalone Grafana's sidecar discovers
      # automatically — so we get the full kubernetes-mixin dashboard set
      # (API server, kubelet, cluster compute, pod resources, networking, etc.)
      # for free.
      defaultDashboardsEnabled: true
      forceDeployDashboards: true
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"

    # ------------------------------------------------------------------
    # Prometheus
    # ------------------------------------------------------------------
    prometheus:
      prometheusSpec:
        # 30-day retention — matches user requirement of one month of metrics.
        retention: 60d
        # Soft cap on disk usage; Prometheus will start dropping oldest blocks
        # if this is reached before the time-based retention kicks in.
        retentionSize: "30GB"

        # Pin to the observability node.
        nodeSelector:
          name: main-pool

        # Resource budget — Prometheus is the heaviest pod in the stack.
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

        # Persistent storage via OCI Block Volume. Size aligned with retention.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: oci-bv
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

        # Scrape every ServiceMonitor in any namespace — we want one place to
        # discover targets, not 20 release-specific selectors.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeNamespaceSelector: {}

        # Drop CPU-heavy histogram series we don't analyse — saves disk
        # without hiding anything we plot.
        # (No drops in Phase 1; left as a placeholder for tuning later.)

    # ------------------------------------------------------------------
    # Alertmanager
    # ------------------------------------------------------------------
    alertmanager:
      # Use the Secret pre-created by ESO from Vault (see externalsecrets.yaml).
      # Setting useExistingSecret: true tells the chart NOT to generate a
      # secret from chart values.
      alertmanagerSpec:
        useExistingSecret: true
        configSecret: alertmanager-kube-prometheus-stack-alertmanager

        nodeSelector:
          name: main-pool

        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

        # No persistent storage — Alertmanager runs on an emptyDir (the chart
        # default when `storage` is unset). On a personal stand the alert
        # history / silences are not worth a full 50 GB OCI block volume
        # (oci-bv minimum), and they reset on pod restart, which is fine here.

    # ------------------------------------------------------------------
    # node-exporter — DaemonSet on every node
    # ------------------------------------------------------------------
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      # node-exporter MUST run on every node, including the tainted
      # observability node — otherwise we lose node metrics for that node.
      tolerations:
        - operator: Exists

    # ------------------------------------------------------------------
    # kube-state-metrics — single deployment
    # ------------------------------------------------------------------
    kube-state-metrics:
      nodeSelector:
        name: main-pool
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

      # Flux resource state as gotk_resource_info, which the GitOps — Flux dashboard
      # reads. Flux v2 no longer exports gotk_reconcile_condition from its controllers.
      # Flux's documented replacement is kube-state-metrics reading the Flux custom
      # resources. This is the config from fluxcd/flux2-monitoring-example
      # (monitoring/controllers/kube-prometheus-stack/kube-state-metrics-config.yaml),
      # with two deliberate differences:
      #   * The example also sets `collectors: []` and --custom-resource-state-only=true.
      #     That is left out here: those two settings turn off every built-in kube_*
      #     metric, which the Cluster/Applications dashboards and the chart's alert rules
      #     need. The example's own comment says to comment them out on a stack that is
      #     already installed.
      #   * The image.toolkit.fluxcd.io kinds use v1beta2, not v1. The CRDs from Flux
      #     v2.6.4 (image-reflector v0.35, image-automation v0.41) define only v1beta1 and
      #     v1beta2 for that group. kube-state-metrics resolves each configured
      #     group/version/kind against the installed CRDs, so a version the cluster lacks
      #     produces no metrics. Switch these to v1 when Flux is upgraded to v2.7+.
      # Each series is gotk_resource_info{customresource_kind, exported_namespace, name,
      # ready, suspended, revision, ...} = 1, one per Flux object (47 today). A label whose
      # path is missing, such as `suspended` when spec.suspend is unset, is omitted.
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      endpoint: [spec, endpoint]
                      bucket_name: [spec, bucketName]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      webhook_path: [status, webhookPath]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      image: [spec, image]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      source_name: [spec, imageRepositoryRef, name]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      source_name: [spec, sourceRef, name]

    # ------------------------------------------------------------------
    # Prometheus Operator itself
    # ------------------------------------------------------------------
    prometheusOperator:
      nodeSelector:
        name: main-pool
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      admissionWebhooks:
        patch:
          # The patch Job that injects the webhook CA also needs to land
          # somewhere with capacity.
          nodeSelector:
            name: main-pool

    # ------------------------------------------------------------------
    # OKE-specific: skip scrape configs that need control-plane access
    # ------------------------------------------------------------------
    # The OKE control plane (api-server, scheduler, controller-manager,
    # etcd, kube-proxy) is managed by Oracle — we don't have access to
    # scrape it. Disable those scrape jobs to avoid noisy "DOWN" alerts.
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    coreDns:
      enabled: true
    kubelet:
      enabled: true
      serviceMonitor:
        # kubelet metrics scrape may fail on managed clusters; keep cAdvisor.
        cAdvisor: true
        probes: true
