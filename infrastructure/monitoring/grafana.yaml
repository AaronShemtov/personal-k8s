---
# Grafana — standalone HelmRelease so the dashboards / datasources / auth
# config is decoupled from the kube-prometheus-stack chart.
#
# Pinning chart version 8.5.2 (Grafana 11.3.x).
#
# Access model:
#   * Anonymous users get the Viewer role automatically (no login needed).
#     Anyone visiting grafana.1ms.my sees dashboards but cannot edit.
#   * Admin signs in with the credentials reconciled from OCI Vault.
#
# Datasources: Prometheus + Loki, both in-cluster Services.
# Dashboards: provisioned from ConfigMaps (sidecar discovers them by label).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: grafana
      version: "8.5.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nodeSelector:
      name: main-pool

    # Pin the Grafana image tag explicitly. The Helm chart's appVersion
    # tracks Grafana releases on its own cadence, so for predictability we
    # set the image tag here rather than relying on whatever the chart
    # picked. Bump deliberately when you want a new Grafana version.
    #
    # repository is just "grafana/grafana" — the chart prepends docker.io/
    # automatically. Adding "docker.io/" here would result in the wrong
    # URL "docker.io/docker.io/grafana/grafana".
    image:
      repository: grafana/grafana
      tag: "11.3.9"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

    # Persistence disabled — Grafana runs on an emptyDir. This is safe here
    # because everything stateful is provisioned from git: dashboards come
    # from ConfigMaps via the sidecar, datasources are declared below, and
    # admin creds come from the ESO secret. The only thing lost on a pod
    # restart is ad-hoc UI edits, which we keep in git anyway.
    #
    # Why this matters: oci-bv has a 50 GB minimum block volume, so even a
    # 2Gi PVC request would consume a full 50 GB toward the tenancy's free
    # storage budget. emptyDir consumes zero block storage.
    persistence:
      enabled: false

    # Mount the home-dashboard ConfigMap as a file inside the Grafana pod.
    # The default_home_dashboard_path in grafana.ini reads from here.
    #
    # This is independent of the sidecar-based dashboard provisioning below.
    # The sidecar loads dashboards INTO Grafana as DB rows; default_home
    # needs a JSON file on disk because it's read at server startup before
    # the sidecar has finished its first sync.
    extraConfigmapMounts:
      - name: grafana-home-dashboard
        mountPath: /etc/grafana/dashboards/home
        configMap: grafana-home-dashboard
        readOnly: true

    # Admin password comes from the ESO-reconciled Secret.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    # Inject the SECRET_KEY env var from its own ExternalSecret-managed secret.
    envFromSecret: grafana-secret-key

    # The Azure service-principal secret, read by the Azure Monitor datasource
    # below through $__env{}. envValueFrom rather than a second envFromSecret,
    # because that value takes one name only.
    #
    # optional: true is the important part. Without it, a Secret that has not
    # synced yet — the vault entry missing, ESO not reconciled — would put Grafana
    # in CreateContainerConfigError and take the whole monitoring stack down over a
    # datasource nobody had configured yet. With it, Grafana starts, and only the
    # Azure datasource is broken until the secret arrives.
    envValueFrom:
      AZURE_MONITOR_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-azure-monitor
          key: client-secret
          optional: true

    # ---------------- grafana.ini ----------------
    grafana.ini:
      server:
        root_url: "https://grafana.1ms.my"
        serve_from_sub_path: false
      # Home dashboard — what the user sees when opening grafana.1ms.my.
      # Points at a dashboard JSON file mounted from a ConfigMap via the
      # extraConfigmapMounts section below.
      #
      # The "Cluster — Overview" dashboard is the most informative landing:
      # node count, pod count, restarts, CPU/mem per node, log volume.
      # Logged-in users can still change their personal home via Profile.
      dashboards:
        default_home_dashboard_path: /etc/grafana/dashboards/home/cluster-overview.json
      security:
        # SECRET_KEY env will override this at runtime via envFromSecret.
        admin_user: admin
        cookie_secure: true
        cookie_samesite: lax
      # Anonymous read-only access — anyone sees dashboards, no login required.
      "auth.anonymous":
        enabled: true
        org_name: "Main Org."
        org_role: Viewer
        hide_version: true
      auth:
        disable_login_form: false
        disable_signout_menu: false
      "auth.basic":
        enabled: true
      users:
        allow_sign_up: false
        # New anonymous users join automatically as Viewer per auth.anonymous.
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      log:
        mode: console
        level: info
      # We are behind Cloudflare; trust the X-Forwarded-* headers it sends.
      "auth.proxy":
        enabled: false

    # ---------------- Datasources ----------------
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            access: proxy
            isDefault: true
            editable: false
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
            editable: false
          # Azure's own view of the AI resource. Everything the agents know about
          # themselves — tokens, turns, tool latency, policy decisions — is already
          # here from the client side, and that is the better vantage point: this
          # cluster knows the agent, the profile and the tool, while Azure only
          # knows the deployment.
          #
          # What Azure has and the platform cannot see: throttling and quota (429s,
          # TPM/RPM), what the deployments actually cost, and content-filter events.
          # That is the reason for this datasource, not duplicating the dashboards.
          #
          # No exporter and no extra pod: the plugin ships with Grafana and Azure
          # OpenAI publishes to Azure Monitor on its own. Metrics only — request
          # logs would mean Diagnostic Settings into Log Analytics, whose ingestion
          # is the one part of this stack that costs money.
          - name: Azure Monitor
            type: grafana-azure-monitor-datasource
            uid: azuremonitor
            access: proxy
            editable: false
            jsonData:
              azureAuthType: clientsecret
              cloudName: azuremonitor
              # grafana-azure-monitor, Monitoring Reader on the ai-agent-support
              # account only. Read-only and scoped to one resource.
              tenantId: b94c84c1-ee14-4b02-b2e0-5843df3bce5d
              clientId: 323c9a3a-0a32-4750-a4d6-fc16d94ae653
              subscriptionId: 7839dddb-f816-4f74-96c9-87868efc36b6
            secureJsonData:
              # Interpolated by Grafana at provisioning time from the env var
              # above, so the credential itself never appears in this repository.
              clientSecret: $__env{AZURE_MONITOR_CLIENT_SECRET}

    # ---------------- Dashboard provisioning ----------------
    # The chart deploys a sidecar (kiwigrid/k8s-sidecar) that watches for
    # ConfigMaps with label grafana_dashboard=1 in the same namespace and
    # auto-imports them. The dashboard ConfigMaps are defined in
    # dashboards-configmap.yaml.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        # Search across all namespaces. The kube-prometheus-stack chart
        # creates its dashboard ConfigMaps in the monitoring namespace,
        # but if a future chart drops dashboards elsewhere (e.g. Loki
        # dashboards in a sub-release) we want to pick them up too.
        searchNamespace: ALL
        # Provisioner config for the folder
        provider:
          allowUiUpdates: false
          foldersFromFilesStructure: true
      datasources:
        enabled: false

    # ---------------- Default dashboards from chart ----------------
    # The chart can bundle some "official" dashboards. We disable here and
    # provide our own curated set via the ConfigMaps.
    defaultDashboardsEnabled: false

    # ---------------- Service ----------------
    service:
      type: ClusterIP
      port: 80
      targetPort: 3000

    # ---------------- Probes ----------------
    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 60
      timeoutSeconds: 30
      failureThreshold: 10