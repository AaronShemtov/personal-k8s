---
# Grafana Alloy — log collection agent. Successor to Grafana Agent and
# Promtail. Runs as a DaemonSet on every node, tails container logs from
# /var/log/pods, enriches them with k8s metadata, ships to Loki.
#
# Pinning chart version 0.10.0 (Alloy 1.5.x).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "0.10.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset
      # Run on EVERY node — we need logs from app nodes too, not just obs.
      tolerations:
        - operator: Exists

    alloy:
      # Open the OTLP ports on the Alloy pod AND the Alloy Service, so apps
      # can send traces to alloy.monitoring.svc:4317 (gRPC) / :4318 (HTTP).
      # Without this the receiver listens inside the container but nothing
      # routes to it from other pods.
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      # The Alloy "river" config — discovers k8s pods, tails their stdout
      # logs, attaches namespace/pod/container labels, ships to Loki.
      configMap:
        create: true
        content: |-
          // ----- Discover all pods on this node -----
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          // ----- Build per-pod labels for Loki streams -----
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app_name"
            }
            // Tag the cluster + node for multi-cluster scenarios later.
            rule {
              target_label = "cluster"
              replacement  = "personal-il-jerusalem-1"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          // ----- Tail the log files for those pods -----
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver]
          }

          // ----- Send everything to our Loki -----
          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

          // ==========================================================
          // TRACES pipeline (added for Tempo).
          // Apps send OTLP here; Alloy batches and forwards to Tempo.
          // This is fully independent of the logs pipeline above —
          // adding it does not affect Loki log collection.
          // ==========================================================

          // ----- Receive OTLP traces from applications -----
          // gRPC on 4317, HTTP on 4318. Apps point their OTLP exporter at
          // the Alloy Service (alloy.monitoring.svc) on these ports.
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces = [otelcol.processor.batch.default.input]
            }
          }

          // ----- Batch spans before export (efficiency) -----
          otelcol.processor.batch "default" {
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // ----- Export traces to Tempo -----
          // Tempo's OTLP gRPC receiver is on 4317. tls.insecure because this
          // is plain in-cluster traffic (no mTLS between Alloy and Tempo).
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.monitoring.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }

    # Alloy needs to read pod logs from the host filesystem.
    # The host paths /var/log/pods and /var/lib/docker/containers are mounted
    # by the chart by default; the privileged PSS allows it.
    serviceMonitor:
      enabled: true
