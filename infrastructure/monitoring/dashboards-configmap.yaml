---
# Each ConfigMap in this file carries one Grafana dashboard JSON. The Grafana
# sidecar (configured in grafana.yaml) watches for ConfigMaps with the label
# grafana_dashboard=1 in the monitoring namespace and auto-imports them on
# Grafana startup.
#
# Dashboard JSON is the full Grafana dashboard model (panels, queries,
# variables, layout). We use trimmed-down hand-curated dashboards instead
# of the giant community ones — they target our specific stack.

# ============================================================================
# 1. CLUSTER OVERVIEW — nodes, pods, basic resource view
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Nodes Ready",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_node_status_condition{condition='Ready',status='true'})",
            "refId": "A"
          }],
          "options": { "colorMode": "value", "graphMode": "none" }
        },
        {
          "type": "stat",
          "title": "Total Pods Running",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{phase='Running'})",
            "refId": "A"
          }],
          "options": { "colorMode": "value", "graphMode": "none" }
        },
        {
          "type": "stat",
          "title": "Pods Not Ready",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_ready{condition='false'})",
            "refId": "A"
          }],
          "options": { "colorMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Pod Restarts (last 24h)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(increase(kube_pod_container_status_restarts_total[24h]))",
            "refId": "A"
          }],
          "options": { "colorMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "yellow" },
                  { "value": 5, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Node CPU Usage (%)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
            "legendFormat": "{{instance}}",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 }
          }
        },
        {
          "type": "timeseries",
          "title": "Node Memory Usage (%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
            "legendFormat": "{{instance}}",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 }
          }
        },
        {
          "type": "timeseries",
          "title": "Pods by Namespace",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (namespace) (kube_pod_info)",
            "legendFormat": "{{namespace}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "title": "Pod Restart Rate (per 5min)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[5m]))",
            "legendFormat": "{{namespace}}/{{pod}}",
            "refId": "A"
          }]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["cluster", "overview"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Cluster — Overview",
      "uid": "cluster-overview",
      "version": 1
    }

---
# ============================================================================
# 2. APPLICATIONS — per-namespace traffic, pod resource usage
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-applications
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  applications.json: |-
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "URL Shortener — Pods",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='urlshortener',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "About Me — Pods",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='aboutme',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Infra — Pods",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='infra',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Pwd — Pods",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='pwd',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "My IP — Pods",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='myip',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "AI Agents — Pods",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='agents',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "AI SRE Agent — Pods",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{namespace='ai-sre-agent',phase='Running'})",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "title": "CPU Usage by Application Pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~'urlshortener|aboutme|infra|pwd|myip|agents|ai-sre-agent',container!=''}[5m]))",
            "legendFormat": "{{namespace}}/{{pod}}",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "type": "timeseries",
          "title": "Memory Usage by Application Pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~'urlshortener|aboutme|infra|pwd|myip|agents|ai-sre-agent',container!=''})",
            "legendFormat": "{{namespace}}/{{pod}}",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "timeseries",
          "title": "Network RX by Application Pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (namespace, pod) (rate(container_network_receive_bytes_total{namespace=~'urlshortener|aboutme|infra|pwd|myip|agents|ai-sre-agent'}[5m]))",
            "legendFormat": "{{namespace}}/{{pod}}",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },
        {
          "type": "timeseries",
          "title": "Network TX by Application Pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (namespace, pod) (rate(container_network_transmit_bytes_total{namespace=~'urlshortener|aboutme|infra|pwd|myip|agents|ai-sre-agent'}[5m]))",
            "legendFormat": "{{namespace}}/{{pod}}",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["applications"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Applications — 1ms.my Platform",
      "uid": "applications",
      "version": 1
    }

---
# ============================================================================
# 3. LOGS EXPLORER — Loki-backed log view per namespace
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  logs.json: |-
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "timeseries",
          "title": "Log volume by namespace (lines/sec)",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{
            "expr": "sum by (namespace) (rate({namespace=~\".+\"}[1m]))",
            "legendFormat": "{{namespace}}",
            "refId": "A"
          }]
        },
        {
          "type": "logs",
          "title": "Logs — filter by namespace via $ns variable",
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{
            "expr": "{namespace=~\"$ns\"}",
            "refId": "A"
          }],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["logs", "loki"],
      "templating": {
        "list": [
          {
            "name": "ns",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": { "type": "labelValues", "label": "namespace" },
            "current": { "text": "urlshortener", "value": "urlshortener" },
            "includeAll": true,
            "multi": true,
            "label": "Namespace"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Logs — Explorer",
      "uid": "logs-explorer",
      "version": 1
    }

---
# ============================================================================
# 4. GITOPS — Flux reconciliation health
# ============================================================================
# Two data sources, both set up the way Flux documents it (fluxcd/flux2-monitoring-example):
#   * gotk_resource_info: object state (Ready, suspended, revision), one series per
#     Flux object. kube-state-metrics exports it from the Flux custom resources
#     (customResourceState in kube-prometheus-stack.yaml). This replaces
#     gotk_reconcile_condition, which Flux v2 no longer exports.
#   * gotk_reconcile_duration_seconds: reconcile timing, scraped from the controllers
#     by the PodMonitor in flux-podmonitor.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-gitops
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gitops.json: |-
    {
      "annotations": { "list": [] },
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Kustomizations — Ready",
          "description": "Kustomizations whose Ready condition is True. Source: gotk_resource_info from kube-state-metrics.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "count(gotk_resource_info{customresource_kind='Kustomization',ready='True'}) or (0 * count(gotk_resource_info{customresource_kind='Kustomization'}))",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Kustomizations — NOT Ready",
          "description": "Kustomizations whose Ready condition is not True: False, Unknown, or not reported yet. Source: gotk_resource_info from kube-state-metrics.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "count(gotk_resource_info{customresource_kind='Kustomization',ready!='True'}) or (0 * count(gotk_resource_info{customresource_kind='Kustomization'}))",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "HelmReleases — Ready",
          "description": "HelmReleases whose Ready condition is True. Source: gotk_resource_info from kube-state-metrics.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "count(gotk_resource_info{customresource_kind='HelmRelease',ready='True'}) or (0 * count(gotk_resource_info{customresource_kind='HelmRelease'}))",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "HelmReleases — NOT Ready",
          "description": "HelmReleases whose Ready condition is not True: False, Unknown, or not reported yet. Source: gotk_resource_info from kube-state-metrics.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "count(gotk_resource_info{customresource_kind='HelmRelease',ready!='True'}) or (0 * count(gotk_resource_info{customresource_kind='HelmRelease'}))",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "type": "table",
          "title": "Reconciliation status — all Flux objects",
          "description": "One row per Flux object, from gotk_resource_info (kube-state-metrics). Ready is the object's Ready condition. It is blank for Alerts and Providers, which have no Ready condition, and for OCI HelmRepositories, which Flux does not reconcile. Suspended is blank unless spec.suspend is set.",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "max by (customresource_kind, exported_namespace, name, ready, suspended, revision) (gotk_resource_info)",
            "format": "table",
            "instant": true,
            "refId": "A"
          }],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true },
                "indexByName": { "customresource_kind": 0, "exported_namespace": 1, "name": 2, "ready": 3, "suspended": 4, "revision": 5 },
                "renameByName": { "customresource_kind": "Kind", "exported_namespace": "Namespace", "name": "Name", "ready": "Ready", "suspended": "Suspended", "revision": "Revision" }
              }
            }
          ],
          "options": {
            "showHeader": true,
            "sortBy": [{ "displayName": "Kind", "desc": false }]
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Ready" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  { "id": "mappings", "value": [{
                    "type": "value",
                    "options": {
                      "True": { "text": "True", "color": "green", "index": 0 },
                      "False": { "text": "False", "color": "red", "index": 1 },
                      "Unknown": { "text": "Unknown", "color": "orange", "index": 2 }
                    }
                  }] }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "Reconciliation duration by kind (p95, 1h window)",
          "description": "95th percentile of gotk_reconcile_duration_seconds, scraped from the Flux controllers by the flux-system PodMonitor. The window is 1h because HelmReleases, HelmCharts and HelmRepositories reconcile every 30m to 24h, so a 5m window leaves those kinds empty most of the time.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum by (kind, le) (rate(gotk_reconcile_duration_seconds_bucket[1h])))",
            "legendFormat": "{{kind}}",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Image automation — reconciles per hour",
          "description": "Reconciliations per hour of each ImageRepository, ImagePolicy and ImageUpdateAutomation, from gotk_reconcile_duration_seconds_count.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum by (kind, name) (increase(gotk_reconcile_duration_seconds_count{kind=~'ImageRepository|ImagePolicy|ImageUpdateAutomation'}[1h]))",
            "legendFormat": "{{kind}}/{{name}}",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["gitops", "flux"],
      "templating": { "list": [] },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "GitOps — Flux",
      "uid": "gitops-flux",
      "version": 1
    }
