---
# Loki — log aggregation for Grafana.
#
# Pinning chart version 6.20.0 (Loki 3.2.x).
#
# Mode: SingleBinary. For our scale (≤ 100 req/day, < 50 MB/month log volume)
# a microservices Loki deployment would be massive overkill. SingleBinary
# runs all components (ingester, querier, compactor, distributor) in one
# pod, backed by a single PVC.
#
# Storage: filesystem driver on a Block Volume PVC. Long-term we could
# migrate to OCI Object Storage (S3-compatible) but that's a Phase 2
# concern — filesystem is fine for personal-scale data.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: "6.20.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      # 30 days of logs. Compactor enforces retention by deleting old chunks.
      limits_config:
        # 30 days. Measured volume is about 48 MB a day across 14 namespaces —
        # and falling, since ndots:1 removed the 77% of CoreDNS traffic that was
        # failed search-suffix lookups. A month is therefore ~1.4 GB against the
        # 16 GB free on the node, with room to spare as things get noisier.
        retention_period: 720h
        # Be lenient — we don't expect high cardinality but a misbehaving
        # Alloy could push more streams than we expect.
        max_global_streams_per_user: 10000
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 6
      compactor:
        working_directory: /var/loki/compactor
        delete_request_store: filesystem
        retention_enabled: true
        retention_delete_delay: 2h

    singleBinary:
      replicas: 1
      nodeSelector:
        name: main-pool
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Persistence disabled — Loki's SingleBinary runs on an emptyDir.
      # On a personal stand logs are short-lived and disposable; the AI SRE
      # agent reads live pod logs directly (not from Loki), so losing Loki
      # history on a restart costs nothing operationally. Avoids a 50 GB OCI
      # block volume (oci-bv minimum) for a 5Gi request.
      persistence:
        enabled: false

      # With persistence off the chart mounts nothing at /var/loki, and the container
      # rootfs is read-only, so Loki's `mkdir /var/loki` fails and it crashes. It needs
      # a writable volume there for chunks, the tsdb index, the wal and the compactor.
      #
      # hostPath rather than emptyDir, and rather than a PVC. Each choice is a trade
      # made with eyes open:
      #
      #   * emptyDir — what this was — loses everything when the pod restarts, which
      #     made the 30-day retention above a fiction. Flux rolls pods several times a
      #     day, so the real window was hours.
      #   * a PVC on oci-bv would be durable and would migrate with the pod, but the
      #     minimum billable volume is 50 GB and only one more fits in the 200 GB Always
      #     Free allowance. Spending the last slot on ~1.4 GB of logs is not a trade
      #     worth making; that slot should go to something that needs a filesystem.
      #   * hostPath survives pod restarts, costs no block volume, and loses data when
      #     the node is replaced. On this cluster that is a real event — both nodes were
      #     hours old when this was written — so treat the history as best-effort.
      #
      # Deliberately NOT pinned to a node. Pinning would keep the data across
      # reschedules but leaves Loki Pending forever when OKE replaces the node it is
      # bound to, and a silently missing log pipeline is worse than a reset one. Without
      # a pin, a move costs the history and Loki comes straight back up — the same
      # failure emptyDir had, but only on node replacement instead of every rollout.
      # Kubernetes does not manage ownership on a hostPath volume — fsGroup applies to
      # volumes whose driver can chown, and hostPath has no driver. The kubelet creates
      # the directory as root:root 0755, Loki runs as uid 10001, and it dies on startup
      # with `mkdir /var/loki/rules: permission denied`. One container, run once, fixes
      # the ownership; everything after it keeps the chart's non-root context.
      initContainers:
        - name: chown-loki-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 10001:10001 /var/loki && chmod 0770 /var/loki
          securityContext:
            # Only this container, and only to call chown. runAsNonRoot has to be
            # switched off here explicitly because the pod-level context sets it.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: loki-data
              mountPath: /var/loki
      extraVolumes:
        - name: loki-data
          hostPath:
            path: /var/lib/loki
            type: DirectoryOrCreate
      extraVolumeMounts:
        - name: loki-data
          mountPath: /var/loki

    # We don't need the gateway (it's an nginx in front of Loki for
    # auth/multi-tenant). Single binary, no auth, simple.
    gateway:
      enabled: false

    # The chart provisions a 50 GB MinIO-backed cache by default. Disable —
    # we use filesystem storage.
    minio:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Disable the additional components that only matter in microservices mode.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # Don't deploy the test pod.
    test:
      enabled: false

    # Sanity for OKE — Loki uses 9095 (gRPC) and 3100 (HTTP).
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      # On, and set to true deliberately rather than left at false while running anyway —
      # which is what it was doing. The canary writes known lines to stdout and then
      # queries Loki back for them, so it is the only thing here that can notice log
      # collection silently breaking. It already has: 75 of 25,216 entries never came
      # back, and 446 arrived twice.
      #
      # It is not free. Two pods, and about 1972 lines an hour of its own chatter into
      # Loki — roughly 4% of total log volume. Worth it for an end-to-end check that
      # nothing else provides.
      lokiCanary:
        enabled: true
