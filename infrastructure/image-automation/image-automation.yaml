---
# Flux scans OCIR semver tags and updates marked images under applications/.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: urlshortener-backend
  namespace: flux-system
spec:
  image: il-jerusalem-1.ocir.io/axiwhc5fgu9i/urlshortener-backend
  interval: 2m
  secretRef:
    name: ocir-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: urlshortener-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: urlshortener-backend
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
